[blog]
name = "써누애비"
tagline = "선우와 함께 자라는 아빠의 육아·집밥·투자 공부"
daily_min = 1
daily_max = 5
review_pass_score = 24
rewrite_score = 20
max_similarity = 0.82

# Read-only reuse. The upstream bot is never executed or modified.
[community]
enabled = true
repository = "jinhoo-choi/kis-community-bot"
min_score = 14
max_age_days = 1
allowed_kinds = ["research", "policy", "disclosure"]
require_clear_issue_for_stocks = true
require_today_snapshot = true

[categories.parenting]
naver_category_no = 1
display_name = "육아"
subcategories = ["성장·수면", "건강·피부", "육아용품·안전", "육아생활"]
weight = 1
max_daily = 1
rules = [
  "선우와 관련해 사용자가 실제로 입력한 질문에만 답한다. 자율 주제 선정 금지.",
  "건강·질병·약물 내용은 공공기관·학회·병원 등 신뢰 가능한 출처를 우선한다.",
  "개별 아동에 대한 진단이나 치료 지시를 하지 않는다.",
  "월령이 입력되지 않았으면 선우의 나이를 추정하지 않고 적용 월령별 조건을 나눈다.",
  "질문 → 핵심 답변 → 근거와 월령별 조건 → 실천 방법 → 진료·주의 신호 → 출처 순서로 구성한다.",
  "실명·생년월일·병력 등 사적 정보는 원고에 노출하지 않는다. 체험담을 창작하지 않는다."
]

[categories.investment]
naver_category_no = 7
display_name = "투자"
subcategories = ["시장·산업", "기업·종목", "투자공부"]
weight = 1
max_daily = 1
rules = [
  "kis-community-bot의 당일 research·policy·disclosure 통과 자료 facts/src/body를 기반으로만 작성한다.",
  "research·policy를 우선 선정하고 적격 자료가 없을 때만 명확한 이슈의 disclosure를 선택한다.",
  "공개된 자료만 사용하고 비공개·사내 정보는 사용하지 않는다.",
  "종목 글은 공시·계약·수주·임상·승인·정책·규제·실적 등 이슈가 본문에 명확히 드러날 때만 작성한다.",
  "전일 또는 당일 자료만 사용하고 이틀 이상 지난 시세·수급 요약은 작성하지 않는다.",
  "매수·매도 지시, 수익 보장, 단정적 목표가 표현을 금지한다.",
  "자료 날짜는 내부 메타데이터로 검증하고 데이터 출처·실제 사건의 시점·통계 기간을 보존한다. 공개 글에 기준일·작성일 머리말을 붙이지 않고 사실과 해석을 구분한다.",
  "핵심 이슈 → 확인된 사실·수치 → 의미와 해석 → 변수·리스크 → 확인할 항목 → 출처 순서로 구성한다.",
  "원본이 뒷받침하지 않는 수치·원인·매매 경험을 추가하지 않는다. 부족한 내용은 억지로 늘리지 않는다."
]

[categories.exercise]
naver_category_no = 8
display_name = "운동"
subcategories = ["가슴", "등", "하체", "운동기초"]
weight = 1
max_daily = 1
rules = [
  "공식 운동기관·학회·병원 출처로 운동의 의미·주요 근육·준비·수행 순서·실수·중단 신호를 확인한다.",
  "운동 경력·중량·효과·부상을 창작하지 않는다. 획일적인 고중량·한계반복을 권하지 않는다.",
  "보조자와 안전장치, 통증·어지럼 등 중단 신호를 다룬다."
]

[categories.cooking]
naver_category_no = 6
display_name = "요리"
subcategories = ["집밥", "간단요리", "면·한그릇"]
weight = 1
max_daily = 0
rules = [
  "사용자가 올린 레시피와 사진이 모두 있을 때만 작성한다. 외부 레시피와 대체 이미지 금지.",
  "재료·양·시간·온도는 제공된 값을 유지하며 빠진 값은 추측하지 않는다.",
  "식품 안전과 알레르기 관련 표현은 과장하지 않는다.",
  "요리 소개 → 제공된 분량·재료 → 실제 조리 순서 → 제공된 팁 → 사진 설명 순서로 구성한다.",
  "사진을 직접 분석하지 않았으므로 입력 캡션 외의 색·질감·맛을 단정하지 않는다.",
  "성공 후기나 가족 반응을 창작하지 않는다. 미제공 팁은 추가하지 않는다."
]

[editorial]
enabled = true
require_structure = true
benchmark_target = 5
benchmark_mode = "api"

# Optional ranking of existing eligible inputs; missing credentials preserve queue order.
[topics]
enabled = true

[images]
mode = "generate"
model = "gpt-image-2.5-flare"
quality = "medium"
size = "1024x1024"
output_format = "jpeg"
concurrency = 2
timeout_seconds = 120
max_attempts = 2
parenting_count = 5
exercise_count = 5
investment_count = 3
investment_extended_count = 4
investment_extended_min_chars = 2500

# Verified in the owner editor on 2026-09-26; UI changes stop saving.
[naver]
title_selector = ".se-documentTitle .se-text-paragraph"
body_selector = ".se-main-container .se-component.se-text .se-text-paragraph"
uploaded_image_selector = ".se-component.se-image img"
