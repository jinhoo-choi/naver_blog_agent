  "제목은 핵심 검색어와 구체적 질문/결과를 담는다. 첫1~2문장은 핵심 답변·독자가 얻을 것을 요약한다. 실제 제공 경험은 짧게 연결하고 구매·사용·효과·실패·가족 반응을 창작하지 않는다.",
