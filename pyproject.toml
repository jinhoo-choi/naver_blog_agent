[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "naver-blog-agent"
version = "0.3.0"
description = "Human-reviewed Naver Blog draft automation for parenting, investment, and cooking content"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0,<3",
  "playwright>=1.52.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[project.scripts]
blogbot = "blogbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
