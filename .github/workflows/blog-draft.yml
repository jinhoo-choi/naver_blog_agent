name: Naver Blog Draft

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'KST daily candidate target (1-5)'
        type: choice
        default: '3'
        options: ['1', '2', '3', '4', '5']
      mode:
        description: 'Generate text, save drafts, or retry approved text'
        type: choice
        default: generate
        options: [generate, save, retry]
  repository_dispatch:
    types: [blog_daily]
  schedule:
    # Optional alternative to n8n: 07:17 KST.
    - cron: '17 22 * * *'

permissions:
  contents: read

concurrency:
  group: naver-blog-draft
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.repository == 'jinhoo-choi/naver_blog_agent' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'schedule' || vars.BLOG_SCHEDULE_ENABLED == 'true') &&
      (github.event_name == 'schedule' || github.actor == github.repository_owner)
    # No pull_request/push trigger runs on a machine containing Naver credentials.
    runs-on: [self-hosted, Windows, naver-blog]
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
      NAVER_ID: ${{ secrets.NAVER_ID }}
      NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
      NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
      NAVER_PROFILE_DIR: ${{ vars.NAVER_PROFILE_DIR }}
      BLOG_DATA_DIR: ${{ vars.BLOG_DATA_DIR }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BLOG_NOTIFY_ENABLED: ${{ vars.BLOG_NOTIFY_ENABLED || 'false' }}
      BLOG_DAILY_COUNT: ${{ inputs.count || github.event.client_payload.count || vars.BLOG_DAILY_COUNT || '3' }}
      BLOG_MODE: ${{ inputs.mode || github.event.client_payload.mode || vars.BLOG_MODE || 'generate' }}
      NAVER_HEADLESS: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        shell: powershell
        run: |
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run selected mode
        shell: powershell
        run: |
          if ($env:BLOG_DAILY_COUNT -notmatch '^[1-5]$') { throw 'count must be 1-5' }
          if ($env:BLOG_MODE -eq 'generate') {
            blogbot doctor
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            blogbot daily --count $env:BLOG_DAILY_COUNT
          } elseif ($env:BLOG_MODE -eq 'save') {
            blogbot doctor --require-naver
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            blogbot daily --count $env:BLOG_DAILY_COUNT --save-to-naver
          } elseif ($env:BLOG_MODE -eq 'retry') {
            blogbot retry
          } else {
            throw 'mode must be generate, save or retry'
          }
          exit $LASTEXITCODE
