name: Blog API Prepare

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'prepare resumes media; recover retries failed inputs; bootstrap/probe diagnose setup'
        type: choice
        options: [prepare, recover, bootstrap, probe, manual-images, manual-request, manual-thumbnail]
        default: prepare
      attribution_review_request_id:
        description: 'Recover only: explicitly approved existing request with a one-use attribution manifest'
        type: string
        required: false
        default: ''
      manual_image_request_id:
        description: 'Manual images only: exact approved existing request ID'
        type: string
        required: false
        default: ''
      manual_image_packet:
        description: 'Manual images only: Fernet ciphertext of the pinned reviewed packet; never plaintext'
        type: string
        required: false
        default: ''
      manual_request_id:
        description: 'Manual request only: exact explicitly approved extra draft ID'
        type: string
        required: false
        default: ''
      manual_request_sha256:
        description: 'Manual request only: SHA-256 of the exact approved plaintext envelope'
        type: string
        required: false
        default: ''
      manual_request_packet:
        description: 'Manual request only: bounded Fernet ciphertext, never plaintext'
        type: string
        required: false
        default: ''
  # Target: daily 09:00 Asia/Seoul, after the verified >=07:00 community export.
  # cron-job.org job 8527289 must match; a comment does not change its live schedule.
  # No native schedule: avoid duplicate preparation after external cutover.

permissions:
  contents: read
  actions: read

concurrency:
  group: blog-api-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'jinhoo-choi/naver_blog_agent' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      (inputs.mode != 'prepare' || vars.BLOG_PREPARE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5' }}
      BLOG_BUNDLE_KEY: ${{ secrets.BLOG_BUNDLE_KEY }}
      BLOG_SEED_JSON: ${{ secrets.BLOG_SEED_JSON }}
      # Bounded observed public trend metadata, supplied before the existing 09:00 run.
      # The runner does not inherit Work/cloud-browser login or collect Trends itself.
      BLOG_CREATOR_TRENDS_JSON: ${{ vars.BLOG_CREATOR_TRENDS_JSON }}
      # Optional public source metadata, matched against scored immutable KIS records.
      # Empty input remains a hold; this is never a direct investment candidate.
      BLOG_POLICY_EVIDENCE_JSON: ${{ vars.BLOG_POLICY_EVIDENCE_JSON }}
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      BLOG_DATA_DIR: ${{ github.workspace }}/private-state
      BLOG_ENCRYPTED_OUTPUT: ${{ github.workspace }}/handoff/bundle.enc
      BLOG_NOTIFY_ENABLED: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API preparer
        run: python -m pip install -e .
      - name: Reserve explicitly approved manual request
        id: manual_reservation
        if: inputs.mode == 'manual-request' || inputs.mode == 'manual-thumbnail'
        env:
          MANUAL_RESERVE_MODE: ${{ inputs.mode == 'manual-thumbnail' && 'manual-thumbnail-reserve' || 'manual-request-reserve' }}
          BLOG_MANUAL_REQUEST_PACKET: ${{ inputs.manual_request_packet || '' }}
          MANUAL_REQUEST_ID: ${{ inputs.manual_request_id || '' }}
          MANUAL_REQUEST_SHA256: ${{ inputs.manual_request_sha256 || '' }}
        run: python -m blogbot.cloud "$MANUAL_RESERVE_MODE" --manual-request-id "$MANUAL_REQUEST_ID" --manual-request-sha256 "$MANUAL_REQUEST_SHA256"
      - name: Persist manual reservation before paid work
        if: (inputs.mode == 'manual-request' || inputs.mode == 'manual-thumbnail') && steps.manual_reservation.outputs.cached != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manual_reservation.outputs.artifact_name }}
          path: handoff/bundle.enc
          if-no-files-found: error
          retention-days: 90
      - name: Prepare or resume
        if: (inputs.mode != 'manual-request' && inputs.mode != 'manual-thumbnail') || steps.manual_reservation.outputs.cached != 'true'
        env:
          PREPARE_MODE: ${{ inputs.mode || 'prepare' }}
          BLOG_MANUAL_IMAGE_PACKET: ${{ inputs.manual_image_packet || '' }}
          MANUAL_IMAGE_REQUEST_ID: ${{ inputs.manual_image_request_id || '' }}
          BLOG_MANUAL_REQUEST_PACKET: ${{ inputs.manual_request_packet || '' }}
          MANUAL_REQUEST_ID: ${{ inputs.manual_request_id || '' }}
          MANUAL_REQUEST_SHA256: ${{ inputs.manual_request_sha256 || '' }}
          ATTRIBUTION_REVIEW_REQUEST_ID: ${{ inputs.attribution_review_request_id || '' }}
        run: python -m blogbot.cloud "$PREPARE_MODE" --attribution-review-request-id "$ATTRIBUTION_REVIEW_REQUEST_ID" --manual-image-request-id "$MANUAL_IMAGE_REQUEST_ID" --manual-request-id "$MANUAL_REQUEST_ID" --manual-request-sha256 "$MANUAL_REQUEST_SHA256"
      - name: Preserve encrypted checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff/bundle.enc
          if-no-files-found: error
          retention-days: 90
