  "실제 캡처/직접 제공 사진을 핵심 증거로 사용하고 관련 단계 바로 옆에 배치한다. 캡처3~5장은 편집 목표이며 같은 화면 반복으로 채우지 않는다. Work 임시저장 전 확인 가능한 실제 이미지2장 이상·공식 직접 링크카드1개 이상·재사용 자료1개를 확인한다. 최종 이미지 총수를5장으로 고정하지 않으며 중복되는 보조 삽화는 생략할 수 있다. 제공된 원본영상은 재생 가능한 실제 결과로 활용하고 영상이 없는 주제에는 영상 제작을 강제하지 않는다. AI삽화로 UI·제품·문서·실험 결과를 위조하지 않는다.",
  "원고 조사 단계에서는 실제 읽은 공식 출처와 어느 화면/문서의 어떤 부분이 단계 설명에 필요한지 확인한다. 텍스트 심사 당시 캡처 파일이 아직 없다는 이유만으로 반려하지 않고 Work 저장 단계에서 실제 첨부와 내용을 확인한다. 캡처를 보지 않고 봤다고 쓰지 않는다.",
  "3열 이하 설정/조건/실수 비교표와 독자가 바로 쓸 수 있는 체크리스트·양식·설정값을 넣는다. 프롬프트는 해당 주제에 필요하고 원본이 제공된 경우에만 실제사용본과 수정제안본을 구분해 제공한다. 원본의 오류를 조용히 고쳐 실제사용본이라고 쓰지 않는다.",
  "본문 단계의 실제 공식 제작화면·안내문·템플릿·신청페이지 등 행동 가능한 URL을 확인한다. Work는 관련 설명 위치에 네이버 링크카드1~2개를 배치하고 참고자료 링크도 남긴다. 메인홈·검색페이지보다 해당 기능/자료의 직접링크를 우선하며 무관한 제휴링크를 넣지 않는다. 텍스트 모델은 기존 source_urls 형식으로 확인된 URL을 전달하고 본문에 HTML/가짜버튼을 생성하지 않는다.",
  "독자의 판단·재현에 필요한 적용대상·제약·혼동지점·대안은 관련 사실·단계에 설명한다. 의료/안전/투자 효과의 연구대상·조건·필요한 한계는 보존하되 별도 일반 경고·면책 문단을 강제하지 않는다. 내부 검증·누락·재확인 메모는 소유자에게만 알린다.",
  "모바일 짧은 문단·대소제목·구분선·핵심강조를 유지한다. 글자수보다 질문에 대한 답·재현가능성·시각증거·재사용자료를 우선하며 기존 사실성·안전성·품질 심사는 유지한다. 대표이미지는 전체 핵심을 보여주고 캡처 캡션에 무엇을 확인할지 설명한다. 개인정보는 가리고 외부화면/문서 출처를 남긴다. 캡처·사진은 재사용 권한과 허용 범위를 확인하고 필요한 부분만 사용한다. 권한 또는 필수 근거/캡처/링크가 확인되지 않으면 보류하며 실제 캡처를 생성 이미지로 대체하지 않는다."
]

